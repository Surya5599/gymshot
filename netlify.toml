# Deploys the web app in web/, not the Expo project at the repo root.
# This file overrides the build settings configured in the Netlify UI.

[build]
  base = "web"
  # Pushes the Convex functions first, then builds the site against that
  # deployment (convex deploy sets VITE_CONVEX_URL for the build command).
  # Needs CONVEX_DEPLOY_KEY in the Netlify environment.
  command = "npx convex deploy --cmd 'npm run build'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for any path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
